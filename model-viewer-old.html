<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBJ Viewer</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: rgba(20, 25, 33, 0.85);
    --line: #2a323d;
    --text: #d7dee7;
    --muted: #7d8896;
    --accent: #4da3ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--text); }
  #canvas-wrap { position: fixed; inset: 0; }
  canvas { display: block; }

  #hud {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 16px; min-width: 220px;
    backdrop-filter: blur(8px);
  }
  #hud h1 { font-size: 12px; letter-spacing: 2px; color: var(--muted); font-weight: 600; text-transform: uppercase; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; gap: 16px; font-size: 12px; padding: 3px 0; }
  .row span:last-child { color: var(--muted); }

  #load-btn {
    display: inline-block; margin-top: 12px; width: 100%; text-align: center;
    padding: 8px; border: 1px solid var(--accent); color: var(--accent);
    border-radius: 6px; font-size: 12px; cursor: pointer; background: transparent;
    font-family: inherit; letter-spacing: 1px;
  }
  #load-btn:hover { background: rgba(77, 163, 255, 0.12); }

  #status {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 18px; font-size: 12px; color: var(--muted);
    backdrop-filter: blur(8px); transition: opacity .3s;
  }
  #drop-hint {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; pointer-events: none;
    background: rgba(77, 163, 255, 0.08); border: 3px dashed var(--accent);
    font-size: 18px; letter-spacing: 2px; color: var(--accent);
  }
  body.dragging #drop-hint { display: flex; }
</style>
</head>
<body>
  <div id="canvas-wrap"></div>

  <div id="hud">
    <h1>OBJ Viewer</h1>
    <div class="row"><span>Meshes</span><span id="stat-meshes">—</span></div>
    <div class="row"><span>Vertices</span><span id="stat-verts">—</span></div>
    <div class="row"><span>Size</span><span id="stat-size">—</span></div>
    <button id="load-btn">Load files…</button>
    <input id="file-input" type="file" accept=".obj,.mtl,.png,.jpg,.jpeg,.bmp,.tga" multiple hidden>
  </div>

  <div id="status">Drop <b>.obj</b> + <b>.mtl</b> + textures, or edit MODEL_URL in the source</div>
  <div id="drop-hint">Drop OBJ + MTL + textures</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.164.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.164.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

// ── OPTION A: point at files already on your server ──────────────────
// Set these and the model auto-loads on page open. Leave null to use
// drag-drop / the "Load files…" button instead.
const MODEL_URL = './models/male02.obj';   // e.g. 'model.obj'
const MTL_URL   = './models/male02.mtl';   // e.g. 'model.mtl'
// const MTL_URL   = 'null';   // e.g. 'model.mtl'

// ─────────────────────────────────────────────────────────────────────

const wrap = document.getElementById('canvas-wrap');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1116);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 100000);
camera.position.set(3, 2, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
wrap.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Lights — OBJ files carry no lighting, so without these the model is a black blob.
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(5, 10, 7);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.6);
fill.position.set(-5, 2, -5);
scene.add(fill);

const grid = new THREE.GridHelper(10, 20, 0x2a323d, 0x1a2029);
scene.add(grid);

let current = null;
const status = document.getElementById('status');
function setStatus(msg, hide = false) {
  status.innerHTML = msg;
  status.style.opacity = hide ? '0' : '1';
}

// Center the model at the origin and frame the camera to fit it —
// photogrammetry exports are often huge and offset far from (0,0,0).
function frameObject(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  obj.position.sub(center);

  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const dist = maxDim / (2 * Math.tan((Math.PI * camera.fov) / 360));
  camera.position.set(dist * 0.8, dist * 0.6, dist * 1.4);
  camera.near = maxDim / 1000;
  camera.far = maxDim * 100;
  camera.updateProjectionMatrix();
  controls.target.set(0, 0, 0);
  controls.update();

  grid.scale.setScalar(maxDim / 10);

  let meshes = 0, verts = 0;
  obj.traverse((c) => {
    if (c.isMesh) { meshes++; verts += c.geometry.attributes.position?.count || 0; }
  });
  document.getElementById('stat-meshes').textContent = meshes;
  document.getElementById('stat-verts').textContent = verts.toLocaleString();
  document.getElementById('stat-size').textContent =
    `${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)}`;
}

function showObject(obj) {
  if (current) scene.remove(current);
  current = obj;
  scene.add(obj);
  frameObject(obj);
  setStatus('Loaded', true);
}

// Load from URLs on the server (Option A). MTL first, then OBJ uses those materials.
function loadFromURL(objUrl, mtlUrl) {
  setStatus('Loading…');
  const onObj = (materials) => {
    const loader = new OBJLoader();
    if (materials) { materials.preload(); loader.setMaterials(materials); }
    loader.load(objUrl, showObject, undefined,
      (e) => setStatus('Failed to load OBJ — check the path'));
  };
  if (mtlUrl) {
    new MTLLoader().load(mtlUrl, onObj, undefined,
      () => { setStatus('MTL failed, loading OBJ untextured'); onObj(null); });
  } else {
    onObj(null);
  }
}

// Load from dropped / picked local files. We wire an in-memory URL map so the
// MTL's texture references resolve against the files you provided.
function loadFromFiles(fileList) {
  const files = Array.from(fileList);
  const byName = new Map();
  files.forEach((f) => byName.set(f.name.toLowerCase(), f));
  const objFile = files.find((f) => f.name.toLowerCase().endsWith('.obj'));
  const mtlFile = files.find((f) => f.name.toLowerCase().endsWith('.mtl'));
  if (!objFile) { setStatus('No .obj file found in selection'); return; }

  setStatus('Loading…');
  const manager = new THREE.LoadingManager();
  const blobUrls = [];
  manager.setURLModifier((url) => {
    const name = url.split('/').pop().split('\\').pop().toLowerCase();
    if (byName.has(name)) {
      const u = URL.createObjectURL(byName.get(name));
      blobUrls.push(u);
      return u;
    }
    return url;
  });

  const objURL = URL.createObjectURL(objFile);
  const onObj = (materials) => {
    const loader = new OBJLoader(manager);
    if (materials) { materials.preload(); loader.setMaterials(materials); }
    loader.load(objURL, (obj) => {
      showObject(obj);
      blobUrls.forEach(URL.revokeObjectURL);
      URL.revokeObjectURL(objURL);
    });
  };

  if (mtlFile) {
    const mtlText = new FileReader();
    mtlText.onload = () => {
      const materials = new MTLLoader(manager).parse(mtlText.result, '');
      onObj(materials);
    };
    mtlText.readAsText(mtlFile);
  } else {
    setStatus('No .mtl — loading untextured');
    onObj(null);
  }
}

// ── UI wiring ──
const input = document.getElementById('file-input');
document.getElementById('load-btn').addEventListener('click', () => input.click());
input.addEventListener('change', (e) => loadFromFiles(e.target.files));

['dragenter', 'dragover'].forEach((ev) =>
  window.addEventListener(ev, (e) => { e.preventDefault(); document.body.classList.add('dragging'); }));
['dragleave', 'drop'].forEach((ev) =>
  window.addEventListener(ev, (e) => { e.preventDefault(); document.body.classList.remove('dragging'); }));
window.addEventListener('drop', (e) => { if (e.dataTransfer.files.length) loadFromFiles(e.dataTransfer.files); });

if (MODEL_URL) loadFromURL(MODEL_URL, MTL_URL);

// ── render loop ──
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OBJ Viewer</title>

  <style>
    :root {
      --bg: #0e1116;
      --panel: rgba(20, 25, 33, 0.85);
      --line: #2a323d;
      --text: #d7dee7;
      --muted: #7d8896;
      --accent: #4da3ff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color: var(--text);
    }

    #canvas-wrap {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
    }

    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
      min-width: 250px;
      backdrop-filter: blur(8px);
    }

    #hud h1 {
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: 12px;
      padding: 3px 0;
    }

    .row span:last-child {
      color: var(--muted);
    }

    #status {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 12px;
      color: var(--muted);
      backdrop-filter: blur(8px);
      transition: opacity 0.3s;
    }

  </style>
</head>

<body>

  <div id="canvas-wrap"></div>

  <div id="hud">
    <h1>OBJ Viewer</h1>

    <div class="row">
      <span>Meshes</span>
      <span id="stat-meshes">—</span>
    </div>

    <div class="row">
      <span>Vertices</span>
      <span id="stat-verts">—</span>
    </div>

    <div class="row">
      <span>Size</span>
      <span id="stat-size">—</span>
    </div>

    <div class="row">
      <span>Total chunks</span>
      <span id="stat-total">—</span>
    </div>

    <div class="row">
      <span>Loaded chunks</span>
      <span id="stat-loaded">—</span>
    </div>

    <div class="row">
      <span>Cached chunks</span>
      <span id="stat-cached">—</span>
    </div>
  </div>

  <div id="status">Starting...</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.164.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.164.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">

    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // ==================================================
    // UI ELEMENTS
    // ==================================================


    const MODEL = new URLSearchParams(window.location.search).get("model") || "male";

    const status = document.getElementById("status");
    const statMeshes = document.getElementById("stat-meshes");
    const statVerts = document.getElementById("stat-verts");
    const statSize = document.getElementById("stat-size");
    const statTotal = document.getElementById("stat-total");
    const statLoaded = document.getElementById("stat-loaded");
    const statCached = document.getElementById("stat-cached");

    // ==================================================
    // THREE SETUP
    // ==================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e1116);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.01,
      100000
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.getElementById("canvas-wrap").appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.screenSpacePanning = true;

    // ==================================================
    // LIGHTS
    // ==================================================

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));

    const keyLight = new THREE.DirectionalLight(0xffffff, 2);
    keyLight.position.set(100, 200, 100);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
    fillLight.position.set(-100, 100, -100);
    scene.add(fillLight);

    // Floor grid, scaled to the model size once bounds are known.
    const grid = new THREE.GridHelper(10, 20, 0x2a323d, 0x1a2029);
    scene.add(grid);

    // ==================================================
    // STATE
    // ==================================================

    let manifest = null;

    // Chunks currently in the scene.
    const loadedChunks = new Map();

    // In-flight downloads, to avoid duplicate fetches.
    const loadingChunks = new Map();

    // Downloaded binary data, kept so re-visible chunks
    // don't need to be re-downloaded.
    const chunkCache = new Map();

    const frustum = new THREE.Frustum();
    const projectionMatrix = new THREE.Matrix4();

    // ==================================================
    // MATERIALS + TEXTURES
    // ==================================================

    const fallbackMaterial = new THREE.MeshStandardMaterial({
      color: 0xbfc5cc,
      roughness: 0.8,
      metalness: 0.05,
      side: THREE.DoubleSide,
    });

    const textureLoader = new THREE.TextureLoader();
    let materials = [];

    async function loadMaterials() {
      if (!manifest?.materials || manifest.materials.length === 0) {
        materials = [fallbackMaterial];
        return;
      }

      materials = [];

      for (const materialInfo of manifest.materials) {
        let texture = null;

        if (materialInfo.texture) {
         const textureUrl = `./models/${manifest.modelFolder}/${materialInfo.texture}`;

          try {
            texture = await textureLoader.loadAsync(textureUrl);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;

            console.log(`Loaded texture: ${materialInfo.texture}`);
          } catch (error) {
            console.error(
              `Failed to load texture: ${materialInfo.texture}`,
              error
            );
          }
        }

        materials.push(
          new THREE.MeshStandardMaterial({
            map: texture,
            color: texture ? 0xffffff : 0xbfc5cc,
            roughness: 0.8,
            metalness: 0.05,
            side: THREE.DoubleSide,
          })
        );
      }
    }

    // ==================================================
    // MANIFEST
    // ==================================================

    async function loadManifest() {
      status.textContent = "Loading manifest...";

      const response = await fetch("./chunks/manifest.json")

      if (!response.ok) {
        throw new Error(`Manifest failed: ${response.status}`);
      }

      manifest = await response.json();
      updateStats();
    }

    // ==================================================
    // CHUNK BOX
    // ==================================================

    function getChunkBox(chunk) {
      const bounds = chunk.bounds;

      return new THREE.Box3(
        new THREE.Vector3(bounds.minX, bounds.minY, bounds.minZ),
        new THREE.Vector3(bounds.maxX, bounds.maxY, bounds.maxZ)
      );
    }

    // ==================================================
    // BINARY CHUNK PARSING
    //
    // Header (16 bytes): uint32 vertexCount, indexCount, uvCount, materialIdCount
    // positions   (float32 * vertexCount * 3)
    // uvs         (float32 * uvCount * 2)
    // indices     (uint32 * indexCount)
    // materialIds (uint32 * indexCount / 3)
    // ==================================================

    function parseChunkBuffer(buffer) {
      const view = new DataView(buffer);

      const vertexCount = view.getUint32(0, true);
      const indexCount = view.getUint32(4, true);
      const uvCount = view.getUint32(8, true);

      const positionOffset = 16;
      const positions = new Float32Array(
        buffer,
        positionOffset,
        vertexCount * 3
      );

      const uvOffset = positionOffset + vertexCount * 3 * 4;
      const uvs = new Float32Array(buffer, uvOffset, uvCount * 2);

      const indexOffset = uvOffset + uvCount * 2 * 4;
      const indices = new Uint32Array(buffer, indexOffset, indexCount);

      const materialOffset = indexOffset + indexCount * 4;
      const materialIds = new Uint32Array(
        buffer,
        materialOffset,
        indexCount / 3
      );

      return { vertexCount, indexCount, uvCount, positions, uvs, indices, materialIds };
    }

    function buildGeometry({ positions, uvs, uvCount, indices }) {
      const geometry = new THREE.BufferGeometry();

      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));

      if (uvCount > 0) {
        geometry.setAttribute("uv", new THREE.BufferAttribute(uvs, 2));
      }

      geometry.setIndex(new THREE.BufferAttribute(indices, 1));
      geometry.computeVertexNormals();

      return geometry;
    }

    // Splits per-triangle materialIds into contiguous ranges and
    // registers them as geometry groups, so a single mesh can use
    // multiple materials (THREE.Mesh + material array).
    function applyMaterialGroups(geometry, materialIds, indexCount) {
      geometry.clearGroups();

      if (materialIds.length === 0) {
        geometry.addGroup(0, indexCount, 0);
        return;
      }

      let runStart = 0;
      let runMaterial = materialIds[0];

      for (let i = 1; i <= materialIds.length; i++) {
        const isLast = i === materialIds.length;
        const changed = !isLast && materialIds[i] !== runMaterial;

        if (isLast || changed) {
          geometry.addGroup(runStart * 3, (i - runStart) * 3, runMaterial);
          runStart = i;

          if (!isLast) {
            runMaterial = materialIds[i];
          }
        }
      }
    }

    // ==================================================
    // LOAD CHUNK
    // ==================================================

    async function loadChunk(chunk) {
      if (loadedChunks.has(chunk.id)) {
        return;
      }

      if (loadingChunks.has(chunk.id)) {
        return loadingChunks.get(chunk.id);
      }

      const promise = (async () => {
        try {
          status.textContent = `Loading ${chunk.file}...`;

          let buffer = chunkCache.get(chunk.id);

          if (!buffer) {
            const response = await fetch(`./chunks/${chunk.file}`);

            if (!response.ok) {
              throw new Error(`Chunk failed: ${chunk.file}`);
            }

            buffer = await response.arrayBuffer();
            chunkCache.set(chunk.id, buffer);
          }

          const parsed = parseChunkBuffer(buffer);
          const geometry = buildGeometry(parsed);

          applyMaterialGroups(geometry, parsed.materialIds, parsed.indexCount);

          const meshMaterials = materials.length > 0 ? materials : [fallbackMaterial];
          const mesh = new THREE.Mesh(geometry, meshMaterials);
          mesh.userData.chunkId = chunk.id;

          scene.add(mesh);
          loadedChunks.set(chunk.id, mesh);

          console.log(`Loaded ${chunk.file}`, {
            vertices: parsed.vertexCount,
            indices: parsed.indexCount,
          });

          updateStats();
        } catch (error) {
          console.error(`Failed to load ${chunk.file}`, error);
          throw error;
        } finally {
          loadingChunks.delete(chunk.id);
        }
      })();

      loadingChunks.set(chunk.id, promise);
      return promise;
    }

    // ==================================================
    // UNLOAD CHUNK
    // ==================================================

    function unloadChunk(chunkId) {
      const mesh = loadedChunks.get(chunkId);

      if (!mesh) {
        return;
      }

      scene.remove(mesh);
      mesh.geometry.dispose();
      loadedChunks.delete(chunkId);

      updateStats();
    }

    // ==================================================
    // UPDATE CHUNKS (frustum-based streaming)
    // ==================================================

    let updating = false;

    async function updateChunks() {
      if (!manifest || updating) {
        return;
      }

      updating = true;

      try {
        camera.updateMatrixWorld();

        projectionMatrix.multiplyMatrices(
          camera.projectionMatrix,
          camera.matrixWorldInverse
        );

        frustum.setFromProjectionMatrix(projectionMatrix);

        const loadPromises = [];

        for (const chunk of manifest.chunks) {
          if (!chunk.bounds) {
            continue;
          }

          const box = getChunkBox(chunk);
          const visible = frustum.intersectsBox(box);

          if (visible && !loadedChunks.has(chunk.id)) {
            loadPromises.push(loadChunk(chunk));
          }
        }

        await Promise.allSettled(loadPromises);

        for (const chunk of manifest.chunks) {
          if (!chunk.bounds || !loadedChunks.has(chunk.id)) {
            continue;
          }

          const box = getChunkBox(chunk);
          const visible = frustum.intersectsBox(box);

          if (!visible) {
            unloadChunk(chunk.id);
          }
        }

        updateStats();
        status.textContent = "Binary streaming active";
      } finally {
        updating = false;
      }
    }

    // ==================================================
    // FRAME MODEL
    // ==================================================

    function frameModel() {
      if (!manifest || !manifest.bounds) {
        return;
      }

      const bounds = manifest.bounds;

      const box = new THREE.Box3(
        new THREE.Vector3(bounds.minX, bounds.minY, bounds.minZ),
        new THREE.Vector3(bounds.maxX, bounds.maxY, bounds.maxZ)
      );

      const center = new THREE.Vector3();
      box.getCenter(center);

      const size = new THREE.Vector3();
      box.getSize(size);

      const maxSize = Math.max(size.x, size.y, size.z);
      const distance = maxSize * 1.8;

      camera.position.set(
        center.x + distance,
        center.y + distance * 0.7,
        center.z + distance
      );

      camera.near = Math.max(maxSize / 10000, 0.01);
      camera.far = Math.max(maxSize * 20, 100000);
      camera.updateProjectionMatrix();

      controls.target.copy(center);
      controls.update();

      grid.scale.setScalar(maxSize / 10);
      grid.position.set(center.x, bounds.minY, center.z);

      statMeshes.textContent = manifest.chunks.length;
      statVerts.textContent = Number(manifest.totalVertices || 0).toLocaleString();
      statSize.textContent =
        `${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)}`;
    }

    // ==================================================
    // STATS
    // ==================================================

    function updateStats() {
      if (!manifest) {
        return;
      }

      statTotal.textContent = manifest.chunks.length;
      statLoaded.textContent = loadedChunks.size;
      statCached.textContent = chunkCache.size;
      statVerts.textContent = Number(manifest.totalVertices || 0).toLocaleString();
    }

    // ==================================================
    // START
    // ==================================================

    async function start() {
      try {
        await loadManifest();
        await loadMaterials();

        frameModel();

        status.textContent = "Loading visible chunks...";
        await updateChunks();

        status.textContent = "Binary streaming active";
      } catch (error) {
        console.error(error);
        status.textContent = `Error: ${error.message}`;
      }
    }

    start();

    // ==================================================
    // CAMERA CHANGE -> re-stream chunks (debounced)
    // ==================================================

    let updateTimer = null;

    controls.addEventListener("change", () => {
      clearTimeout(updateTimer);
      updateTimer = setTimeout(() => updateChunks(), 100);
    });

    // ==================================================
    // RESIZE
    // ==================================================

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ==================================================
    // RENDER LOOP
    // ==================================================

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // NOTE: this viewer always streams the pre-converted production
    // model from chunks/manifest.json + chunks/*.bin. To rebuild
    // those from a source .obj, run:
    //
    //   node tool/obj-preprocessor.js [model.obj]

  </script>

</body>
</html>
